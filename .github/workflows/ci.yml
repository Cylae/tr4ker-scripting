name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - tr4ker-dev
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Test the Python tooling
        run: python3 -m unittest discover tests

      - name: Validate userscripts
        run: python3 tools/build_userscripts.py --check

      - name: Check userscript syntax
        run: python3 tools/check_userscripts_syntax.py

      - name: Audit userscripts (informational)
        run: python3 tools/audit_userscripts.py

      - name: Check PimpMyShoutbox Next build
        working-directory: next/pimpmyshoutbox
        run: |
          npm ci
          npm test
          npm run check
